# Sydney Transport Live dashboard
# Map = live GPS. ETA timetable = separate cards (Map cannot show a timetable).
# ETA sensors tick every 1s (m:ss) and re-poll TfNSW about every 15s.

title: Sydney Transport
views:
  - title: Route 311
    path: sydney-transport
    icon: mdi:bus
    cards:
      - type: markdown
        content: |
          ## 311 · 81 Macleay St
          Live map + ETAs for both Rockwall Cres stops.

      - type: map
        title: Live 311 · 81 Macleay St
        default_zoom: 14
        auto_fit: false
        hours_to_show: 0
        entities:
          - entity: zone.macleay_st_home
            name: Home
        geo_location_sources:
          # City buses use the legacy source (works with existing map cards).
          - source: sydney_transport_live
            focus: false
          # Central buses — add this line for grey-ring Central services.
          - source: sydney_transport_live_central
            focus: false
        # Optional: card-mod (HACS). HA's 2nd-source colour is yellow by default;
        # this forces Central-bound buses to a grey ring instead.
        card_mod:
          style:
            ha-map:
              $:
                .leaflet-marker-icon:
                  'ha-entity-marker[data-entity-id*="sydney_transport_live_central"] $':
                    .marker {
                      border-color: #9E9E9E !important;
                      --ha-marker-color: #9E9E9E !important;
                    }

      # ETA timetable — updates every second as the bus approaches
      - type: markdown
        content: >
          ### Macleay St At Rockwall Cres

          → City · ~50 m from home


          {{
            ((state_attr('sensor.route_311_at_rockwall_cres', 'eta_lines') or [])
            | join('\n\n'))
            or '_No 311 departures right now_'
          }}


          ---


          ### Macleay St Opp Rockwall Cres

          → Central · ~90 m from home


          {{
            ((state_attr('sensor.route_311_opp_rockwall_cres', 'eta_lines') or [])
            | join('\n\n'))
            or '_No 311 departures right now_'
          }}

      - type: horizontal-stack
        cards:
          - type: tile
            entity: sensor.route_311_at_rockwall_cres
            name: Next · City
            icon: mdi:bus-clock
          - type: tile
            entity: sensor.route_311_opp_rockwall_cres
            name: Next · Central
            icon: mdi:bus-clock
          - type: tile
            entity: sensor.route_311_active_buses
            name: Active buses
            icon: mdi:bus-multiple
