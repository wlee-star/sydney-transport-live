# Sydney Transport Live dashboard
# Map = live GPS. ETA timetable = separate cards (Map cannot show a timetable).
# ETA sensors tick every 1s (m:ss) and re-poll TfNSW about every 15s.

title: Sydney Transport
views:
  - title: Route 311
    path: sydney-transport
    icon: mdi:bus
    cards:
      - type: markdown
        content: |
          ## 311 · 81 Macleay St
          Live map + ETAs for both Rockwall Cres stops.

      - type: map
        title: Live 311 · 81 Macleay St
        default_zoom: 14
        auto_fit: false
        hours_to_show: 0
        entities:
          - entity: zone.macleay_st_home
            name: Home
        geo_location_sources:
          - source: sydney_transport_live
            focus: false

      # ETA timetable — updates every second as the bus approaches
      - type: markdown
        content: |
          ### Macleay St At Rockwall Cres
          → City · ~50 m from home

          {% set ent = 'sensor.route_311_at_rockwall_cres' %}
          {% if states(ent) in ['unavailable', 'unknown', 'none'] %}
          _Sensor unavailable — update to v1.2.1 and restart HA_
          {% else %}
          {% set lines = state_attr(ent, 'eta_lines') or [] %}
          {% if lines %}
          {% for line in lines %}
          **{{ line }}**
          {% endfor %}
          {% else %}
          _No 311 departures right now_
          {% endif %}
          {% endif %}

          ---

          ### Macleay St Opp Rockwall Cres
          → Central · ~90 m from home

          {% set ent = 'sensor.route_311_opp_rockwall_cres' %}
          {% if states(ent) in ['unavailable', 'unknown', 'none'] %}
          _Sensor unavailable — update to v1.2.1 and restart HA_
          {% else %}
          {% set lines = state_attr(ent, 'eta_lines') or [] %}
          {% if lines %}
          {% for line in lines %}
          **{{ line }}**
          {% endfor %}
          {% else %}
          _No 311 departures right now_
          {% endif %}
          {% endif %}

      - type: horizontal-stack
        cards:
          - type: tile
            entity: sensor.route_311_at_rockwall_cres
            name: Next · City
            icon: mdi:bus-clock
          - type: tile
            entity: sensor.route_311_opp_rockwall_cres
            name: Next · Central
            icon: mdi:bus-clock
          - type: tile
            entity: sensor.route_311_active_buses
            name: Active buses
            icon: mdi:bus-multiple
