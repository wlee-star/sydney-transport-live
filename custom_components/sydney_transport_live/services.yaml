refresh:
  name: Refresh
  description: Request an immediate refresh of vehicle positions and departures.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. Limit the refresh to one config entry.
      example: "01ABCDEF..."
      selector:
        text:
clear_cache:
  name: Clear GTFS cache
  description: Delete the cached static buses GTFS ZIP and download it again.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. Limit the cache clear to one config entry.
      example: "01ABCDEF..."
      selector:
        text:
purge_unavailable_trackers:
  name: Purge unavailable bus trackers
  description: Remove leftover unavailable/unknown Route bus device_tracker entities from the entity registry (bulk cleanup).
  fields:
    include_unknown:
      name: Include unknown
      description: Also remove entities in the unknown state.
      default: true
      selector:
        boolean:
